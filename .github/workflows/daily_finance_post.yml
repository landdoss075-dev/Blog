name: Daily Finance Post

on:
  # GitHub cron отключён из-за задержек. FinMicro вызывает workflow_dispatch
  # ежедневно в 07:10 и 16:10 UTC (10:10 и 19:10 МСК).
  # Публикация: Telegram «Финансовые будни» + сайт/RSS finbudni.ru.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (сгенерировать без публикации)'
        type: boolean
        default: false
      publication_slot:
        description: 'Редакционный слот публикации'
        type: choice
        options:
          - manual
          - morning
          - evening
        default: manual
      force_publish:
        description: 'Разрешить ручную публикацию вне планового окна'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: finance-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Checkout finance site repo
        uses: actions/checkout@v4
        with:
          repository: landdoss075-dev/finbudni
          path: channels/finance/docs
          ssh-key: ${{ secrets.FINBUDNI_DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check finance publication slot
        id: publish_window
        shell: bash
        run: |
          hour="$(date -u +%H)"
          slot="${{ inputs.publication_slot }}"
          if [[ "${{ inputs.dry_run }}" == "true" || "${{ inputs.force_publish }}" == "true" ]]; then
            allowed=1
          elif [[ "$slot" == "morning" && "$hour" == "07" ]]; then
            allowed=1
          elif [[ "$slot" == "evening" && "$hour" == "16" ]]; then
            allowed=1
          else
            allowed=0
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "Finance slot check: slot=$slot utc_hour=$hour allowed=$allowed"

      - name: Run finance post generator
        if: steps.publish_window.outputs.allowed == '1'
        env:
          PROVIDER: ${{ vars.PROVIDER || 'openrouter' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-sonnet-5' }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          OPENROUTER_IMAGE_MODEL: ${{ vars.OPENROUTER_IMAGE_MODEL }}
          IMAGE_ASPECT_RATIO: ${{ vars.IMAGE_ASPECT_RATIO }}
          IMAGE_RESOLUTION: ${{ vars.IMAGE_RESOLUTION }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FINBUDNI_SITE_URL: ${{ vars.FINBUDNI_SITE_URL || 'https://finbudni.ru' }}
          FINBUDNI_TELEGRAM_BOT_TOKEN: ${{ secrets.FINBUDNI_TELEGRAM_BOT_TOKEN }}
          FINBUDNI_TELEGRAM_CHANNEL_ID: ${{ vars.FINBUDNI_TELEGRAM_CHANNEL_ID || '@finanbudni' }}
          FINBUDNI_TELEGRAM_CHANNEL_URL: ${{ vars.FINBUDNI_TELEGRAM_CHANNEL_URL || 'https://t.me/finanbudni' }}
          PUBLICATION_SLOT: ${{ inputs.publication_slot }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/generate_and_post.js --niche=finance

      - name: Commit generated finance site
        if: ${{ steps.publish_window.outputs.allowed == '1' && !inputs.dry_run }}
        working-directory: channels/finance/docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "Нет изменений сайта для коммита."
          else
            git commit -m "finance: новая статья $(date -u +%Y-%m-%d)"
            git push
          fi
